name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint (ruff)
        run: ruff check hostshift/ tests/ scripts/ experiments/

      - name: Package smoke test (wheel builds; console script works)
        run: |
          pip install build
          python -m build --wheel
          pip install --force-reinstall --no-deps dist/*.whl
          hostshift --version
          hostshift hosts
          pip install --force-reinstall --no-deps -e .[dev]

      - name: Full suite (bare-Python compatible runner + e2e pipeline check)
        run: bash scripts/run_tests.sh

      - name: Verify filter specs are solvable end-to-end
        run: python3 scripts/verify_filter_specs.py

      - name: Coverage gate
        run: |
          coverage run -m pytest tests/ -q
          coverage report --fail-under=80 --show-missing
