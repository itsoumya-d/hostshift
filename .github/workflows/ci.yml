name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install textual playwright

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check hostshift/ tests/ scripts/ experiments/

      - name: Run full suite (198 assertions incl. emitted-source golden tests + e2e pipeline check)
        run: bash scripts/run_tests.sh

      - name: Verify filter specs are solvable end-to-end
        run: python3 scripts/verify_filter_specs.py

      - name: Coverage gate
        run: |
          pip install coverage
          for f in tests/test_*.py; do
            coverage run --append --source=hostshift "$f" >/dev/null 2>&1 || exit 1
          done
          coverage report --fail-under=80 --show-missing
