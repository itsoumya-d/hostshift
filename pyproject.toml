[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hostshift"
version = "0.2.0"
description = "Cross-platform UI portability benchmark for LLM-generated interfaces"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
authors = [
    {name = "Soumya Debnath", email = "admin@otaitech.com"},
]
keywords = [
    "benchmark",
    "cross-platform",
    "UI portability",
    "LLM",
    "generative UI",
    "accessibility",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "textual>=0.40",
]

[project.optional-dependencies]
web = ["playwright>=1.40"]
# The new google-genai SDK: harness.py imports `from google import genai`.
# (The legacy `google-generativeai` package exposes a different module layout
# and cannot satisfy that import.)
genai = ["google-genai>=1.0"]
dev = [
    "playwright>=1.40",
    "google-genai>=1.0",
    "ruff>=0.4",
    "coverage[toml]>=7.4",
]

[project.scripts]
hostshift = "hostshift.runner:main"

[project.urls]
Homepage = "https://github.com/itsoumya-d/hostshift"
Repository = "https://github.com/itsoumya-d/hostshift"
Issues = "https://github.com/itsoumya-d/hostshift/issues"

[tool.setuptools.packages.find]
include = ["hostshift*"]

[tool.setuptools.package-data]
hostshift = ["data/*.jsonl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "BLE001",  # standalone test runners catch broadly by design
    "RUF100",  # legacy noqa markers; cleaned opportunistically
    "PLW1510", # subprocess without check= is how the golden tests assert stderr
    "B905",    # zip() strictness adds nothing in these local, equal-length uses
    "ISC004",
]

[tool.ruff.lint.per-file-ignores]
"hostshift/render/*" = ["E501"]  # embedded Kotlin/Swift/JS/Textual source templates
"tests/*" = ["E501"]
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
# Scope pytest to this benchmark's own tests. The workspace also contains
# autopilot-fde (a separate project with its own venv and dependencies);
# without testpaths, a bare `pytest` at the root tries to collect it and dies
# on its missing imports.
testpaths = ["tests"]

[tool.coverage.run]
source = ["hostshift"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
