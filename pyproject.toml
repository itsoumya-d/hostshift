[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "hostshift"
version = "0.1.0"
description = "Cross-platform UI portability benchmark for LLM-generated interfaces"
readme = "README.md"
license = {text = "LicenseRef-HostShift-Research-Only"}
requires-python = ">=3.11"
authors = [
    {name = "Soumya Debnath", email = "admin@otaitech.com"},
]
keywords = [
    "benchmark",
    "cross-platform",
    "UI portability",
    "LLM",
    "generative UI",
    "accessibility",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "textual>=0.40",
]

[project.optional-dependencies]
web = ["playwright>=1.40"]
genai = ["google-generativeai>=0.5"]
dev = [
    "playwright>=1.40",
    "google-generativeai>=0.5",
]

[project.urls]
Homepage = "https://github.com/itsoumya-d/hostshift"
Repository = "https://github.com/itsoumya-d/hostshift"
Issues = "https://github.com/itsoumya-d/hostshift/issues"

[tool.setuptools.packages.find]
include = ["hostshift*"]
