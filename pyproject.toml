[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hostshift"
version = "0.1.0"
description = "Cross-platform UI portability benchmark for LLM-generated interfaces"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
authors = [
    {name = "Soumya Debnath", email = "admin@otaitech.com"},
]
keywords = [
    "benchmark",
    "cross-platform",
    "UI portability",
    "LLM",
    "generative UI",
    "accessibility",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "textual>=0.40",
]

[project.optional-dependencies]
web = ["playwright>=1.40"]
genai = ["google-generativeai>=0.5"]
dev = [
    "playwright>=1.40",
    "google-generativeai>=0.5",
]

[project.urls]
Homepage = "https://github.com/itsoumya-d/hostshift"
Repository = "https://github.com/itsoumya-d/hostshift"
Issues = "https://github.com/itsoumya-d/hostshift/issues"

[tool.setuptools.packages.find]
include = ["hostshift*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "BLE001",  # standalone test runners catch broadly by design
    "RUF100",  # legacy noqa markers; cleaned opportunistically
    "PLW1510", # subprocess without check= is how the golden tests assert stderr
    "B905",    # zip() strictness adds nothing in these local, equal-length uses
    "ISC004",
]

[tool.ruff.lint.per-file-ignores]
"hostshift/render/*" = ["E501"]  # embedded Kotlin/Swift/JS/Textual source templates
"tests/*" = ["E501"]
"scripts/*" = ["E501"]
